name: unpack-and-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAVESHARE_REPO: waveshareteam/ESP32-S3-Touch-AMOLED-2.06
  WAVESHARE_REF: 30f3b23b3d4bb38d32f7d0cddffb66759668a855
  ESP32_CORE: 3.3.11

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project from zip (first run only)
        run: |
          if [ ! -d firmware ] && [ -f robo-friend-206.zip ]; then
            unzip -o robo-friend-206.zip -x ".github/*"
            rm robo-friend-206.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack Robo Friend v0.1 project"
            git push
          fi

      - name: Unit tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Ifirmware/robo_friend \
            test/test_logic.cpp firmware/robo_friend/mood_engine.cpp firmware/robo_friend/gesture.cpp \
            -o test_logic
          ./test_logic

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}

      - name: Fetch display library from Waveshare
        run: |
          git clone https://github.com/${WAVESHARE_REPO}.git ws
          git -C ws checkout ${WAVESHARE_REF}
          mkdir -p "$HOME/Arduino/libraries"
          cp -r ws/examples/arduino/libraries/Arduino_GFX "$HOME/Arduino/libraries/"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc \
            --output-dir out \
            firmware/robo_friend
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: robo-friend-firmware
          path: out/*.bin
